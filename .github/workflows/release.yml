name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test library and Windows settings
        shell: pwsh
        run: |
          $output = & npm test 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - name: Test Electron window and Windows autostart
        run: npm run test:windows
      - name: Build Windows installer and ZIP
        run: node scripts/build-windows.cjs nsis zip
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: ./test/installer.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $archive = Get-ChildItem dist/*-win.zip
          $installer = Get-ChildItem dist/MagmPaper-Setup-*.exe
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows ZIP' }
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $archive.FullName --verify-tag --title "MagmPaper $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
