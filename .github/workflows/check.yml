name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and test integrated taskbar module
        shell: pwsh
        run: |
          $output = & ./scripts/build-taskbar.ps1 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output -join "`n")
            if ($message.Length -gt 4500) { $message = $message.Substring($message.Length - 4500) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - name: Test library and Windows settings
        shell: pwsh
        run: |
          $output = & npm test 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - run: npm run test:windows
      - name: Build Windows installer
        run: node scripts/build-windows.cjs nsis
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: ./test/installer.ps1
