name: Native Windows checks
on:
  push:
    branches: [native-desktop, main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test native library and migration
        shell: pwsh
        run: |
          $output = & dotnet run --project desktop/MagmPaper.Tests/MagmPaper.Tests.csproj -c Release 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - uses: actions/cache/restore@v4
        id: taskbar-cache
        with:
          path: |
            native/build
            native/bin
          key: windows-taskbar-v1-${{ hashFiles('native/taskbar/**', 'scripts/build-taskbar.ps1') }}
      - name: Build and test taskbar module
        if: steps.taskbar-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-taskbar.ps1
      - name: Verify cached taskbar module
        if: steps.taskbar-cache.outputs.cache-hit == 'true'
        run: ctest --test-dir native/build -C Release --output-on-failure
      - uses: actions/cache/save@v4
        if: steps.taskbar-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/build
            native/bin
          key: ${{ steps.taskbar-cache.outputs.cache-primary-key }}
      - name: Publish native WPF application
        id: publish
        shell: pwsh
        run: |
          $output = & dotnet publish desktop/MagmPaper/MagmPaper.csproj -c Release -r win-x64 --self-contained true -o artifacts/native 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $message = ($output -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            exit $code
          }
      - name: Test real WPF UI and GLSL rendering
        run: ./scripts/smoke-native.ps1
      - name: Diagnose native runtime crash
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/smoke)) { exit 0 }
          $dump = Get-ChildItem artifacts/smoke -Filter '*.dmp' | Select-Object -First 1
          if ($dump) {
            dotnet tool install dotnet-dump --tool-path artifacts/tools
            $analysis = & artifacts/tools/dotnet-dump analyze $dump.FullName -c 'setsymbolserver -ms' -c 'clrstack -a -f' -c 'pe' -c 'dumpstack' -c 'exit' 2>&1
            $analysis | Set-Content artifacts/smoke/crash-analysis.txt
            $message = ($analysis -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            Remove-Item $dump.FullName
          }
      - name: Install NSIS
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: choco install nsis --yes --no-progress --limit-output
      - name: Package standalone native installer and ZIP
        id: package
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: ./scripts/package-native.ps1
      - name: Verify Electron upgrade and native installer
        run: ./scripts/test-native-installer.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-app-validation
          path: artifacts/smoke
      - uses: actions/upload-artifact@v5
        with:
          name: windows-native-package
          path: dist/*
          if-no-files-found: error
